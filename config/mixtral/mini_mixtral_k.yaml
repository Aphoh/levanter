data:
  train_urls:
    - "gs://usc2-textdata/fineweb-edu/train-{00000..00119}.jsonl.gz"
  validation_urls:
    - "gs://usc2-textdata/fineweb-edu/train-{00120..00127}.jsonl.gz"
  cache_dir: "gs://usc2-datacache/fineweb-edu-mixtral/"
  tokenizer: "mistralai/Mixtral-8x7B-v0.1"
model:
  type: mixtral
  seq_len: 8192
  hidden_dim: 1024
  intermediate_dim: 512
  num_layers: 16
  num_kv_heads: 2
  num_heads: 8
  tie_word_embeddings: true
  flash_attention_block_size: 512
  route_every_k: 32
  num_experts_per_tok: 4
  n_routed_experts: 32

# TODO: uncomment this once we resolve the resource exhaustion issue
# initialize_from_hf: "mistralai/Mistral-7B-v0.1"
# use_hf_model_config: true
trainer:
  tracker:
    - type: wandb
      project: "levanter"
      tags: ["openwebtext", "minimixtral", "k_test"]

  mp: p=f32,c=bfloat16
  train_batch_size: 256 # set for v4-64 TPU
  num_train_steps: 200
  steps_per_eval: 10
  max_eval_batches: 10
  tensor_parallel_axes: ["mlp", "heads"]
  fsdp_axis: "embed"
  batch_axis: "batch"
  axis_resources:
    token: "data"
optimizer:
  learning_rate: 0.003 # set low for fine-tuning
  weight_decay: 0.1
  min_lr_ratio: 0.1
